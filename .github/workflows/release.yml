name: release

# Sürüm: package.json içindeki version. Elle (Run workflow) ya da v* etiketiyle başlatılır.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # paketler imzasız; mac'te anahtarlık araması yapılmasın
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  icons:
    # .icns/.ico betikleri macOS'un sips/iconutil araçlarını kullanır
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ana ikon repoda (assets/icon-1024.png, "npm run icon" ile üretilir);
      # CI'da Electron penceresi açmadan yalnızca .icns ve .ico türetilir
      - run: |
          mkdir -p build
          cp assets/icon-1024.png build/
          node scripts/make-icns.js
          node scripts/make-ico.js
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: |
            build/icon-1024.png
            build/tvio.icns
            build/icon.ico
          if-no-files-found: error

  build:
    needs: icons
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm ve notlar
        id: meta
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # CHANGELOG.md içindeki "## [v]" bölümü
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "tvio $v" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: tvio ${{ steps.meta.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
